buildscript {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://developer.huawei.com/repo/' }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
        classpath 'com.huawei.agconnect:agcp:1.9.1.301'
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
